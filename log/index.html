<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud log — a record of cloud engineering work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --blueprint: #131B29;
    --paper: #EFEDE3;
    --ink: #1E2430;
    --ink-soft: #5B6270;
    --rule: #D9D5C6;
    --cyan: #8FD3E8;
    --annotation: #B4552A;
    --lvl0: #E4E1D3;
    --lvl1: #E8B98C;
    --lvl2: #D08A4B;
    --lvl3: #B4552A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.65;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  a { color: var(--annotation); text-decoration: none; border-bottom: 1px solid currentColor; }

  .hero { background: var(--blueprint); color: var(--paper); padding: 64px 24px 48px; }
  .hero-inner { max-width: 640px; margin: 0 auto; }
  .prompt { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--cyan); margin-bottom: 18px; }
  .hero h1 { font-family: 'JetBrains Mono', monospace; font-size: clamp(28px, 5vw, 40px); font-weight: 700; margin: 0 0 16px; color: var(--cyan); }
  .hero p { font-size: 17px; color: #C9CDD6; max-width: 480px; margin: 0; }

  main { max-width: 780px; margin: 0 auto; padding: 48px 24px 96px; }

  .grid-wrap { overflow-x: auto; padding-bottom: 8px; }
  .grid {
    display: grid;
    grid-template-rows: repeat(7, 12px);
    grid-auto-flow: column;
    grid-auto-columns: 12px;
    gap: 3px;
    width: max-content;
  }
  .cell { width: 12px; height: 12px; border-radius: 2px; background: var(--lvl0); }
  .cell.level-1 { background: var(--lvl1); }
  .cell.level-2 { background: var(--lvl2); }
  .cell.level-3 { background: var(--lvl3); }

  .legend { display: flex; align-items: center; gap: 6px; margin-top: 16px; font-size: 13px; color: var(--ink-soft); }
  .legend .cell { width: 11px; height: 11px; }

  h2 { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 500; margin: 56px 0 20px; }

  ul.entries { list-style: none; margin: 0; padding: 0; }
  ul.entries li { padding: 14px 0; border-top: 1px solid var(--rule); font-size: 15.5px; color: var(--ink-soft); }
  ul.entries li:first-child { border-top: none; }
  ul.entries .mono { color: var(--ink); font-size: 13px; margin-right: 10px; }
  .empty { color: var(--ink-soft); font-size: 15px; }

  footer { background: var(--blueprint); color: #9AA1AE; padding: 40px 24px; font-family: 'JetBrains Mono', monospace; font-size: 14px; text-align: center; }
  footer a { color: var(--cyan); }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div class="prompt">$ cat cloud-log/history</div>
    <h1>Cloud log</h1>
    <p>A running record of cloud and infrastructure work — one entry per session, logged with a single command.</p>
  </div>
</div>

<main>
  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>
  <div class="legend">
    <span>less</span>
    <span class="cell"></span>
    <span class="cell level-1"></span>
    <span class="cell level-2"></span>
    <span class="cell level-3"></span>
    <span>more</span>
  </div>

  <h2>Recent entries</h2>
  <ul class="entries" id="recent"></ul>
</main>

<footer>
  <a href="/">back to iluvi.xyz</a>
</footer>

<script>
async function loadLog() {
  let entries = [];
  try {
    const res = await fetch('/data/cloud-log.json');
    entries = await res.json();
  } catch (e) {
    entries = [];
  }

  const map = {};
  entries.forEach(e => { map[e.date] = e; });

  const weeks = 26;
  const days = weeks * 7;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const endDow = today.getDay();
  const end = new Date(today);
  end.setDate(today.getDate() + (6 - endDow));
  const start = new Date(end);
  start.setDate(end.getDate() - (days - 1));

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  for (let i = 0; i < days; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    const key = d.toISOString().slice(0, 10);
    const count = map[key] ? map[key].count : 0;
    const div = document.createElement('div');
    div.className = 'cell' + (count > 0 ? ' level-' + levelFor(count) : '');
    div.title = key + (map[key] && map[key].note ? ' — ' + map[key].note : '');
    grid.appendChild(div);
  }

  function levelFor(n) {
    if (n === 1) return 1;
    if (n === 2) return 2;
    return 3;
  }

  const list = document.getElementById('recent');
  list.innerHTML = '';
  if (entries.length === 0) {
    list.innerHTML = '<li class="empty">No entries yet — run log.sh to add the first one.</li>';
    return;
  }
  entries.slice().reverse().slice(0, 10).forEach(e => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="mono">${e.date}</span>${e.note}`;
    list.appendChild(li);
  });
}
loadLog();
</script>

</body>
</html>
